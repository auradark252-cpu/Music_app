name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create Android project
        run: flutter create --platforms=android --org com.example --project-name music_app app

      - name: Copy code
        run: |
          rm -rf app/lib app/test
          mkdir app/lib
          cp pubspec.yaml app/pubspec.yaml
          cp main.dart core.dart screens.dart app/lib/

      - name: Patch Android manifest
        run: python3 patch_manifest.py app/android/app/src/main/AndroidManifest.xml

      - name: Build APK
        working-directory: app
        run: |
          flutter pub get
          flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: music-apk
          path: app/build/app/outputs/flutter-apk/app-release.apk
